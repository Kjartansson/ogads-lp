{% extends "base.html" %}
{% block title %}Log in &mdash; {{ site_name }}{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="alarm">{{ error }}</p>{% endif %}
<form class="card-form" method="post" action="/login">
  <label>Email <input name="email" type="email" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn small">Log in</button>
</form>
<p class="fineprint">No account yet? <a href="/signup">Create your link page</a>.</p>
{% endblock %}
